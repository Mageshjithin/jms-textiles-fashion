name: JMS Billing checks
on:
  push:
    branches: [jms-billing-mongodb]
    paths: ['billing/**', '.github/workflows/billing.yml']
  pull_request:
    paths: ['billing/**', '.github/workflows/billing.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: billing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: billing/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:integration
